<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Information Ethics in the Metaverse — Interactive Mind Map</title>
  <meta name="description" content="INY 715 Assignment 2 — an interactive, multi-level mind map on Information Ethics in the Metaverse." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- styles: tokens → layout → map → panel → media → cinematic -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/media.css" />
  <link rel="stylesheet" href="css/cinematic.css" />
</head>
<body class="cinema">

  <!-- background -->
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-glow g3"></div>
    <canvas id="stars"></canvas>
  </div>

  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
      </span>
      <div class="brand-text">
        <p class="brand-kicker" id="brandKicker"></p>
        <h1 class="brand-title" id="brandTitle"></h1>
        <nav class="crumb" id="crumb" aria-label="Where you are"></nav>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="progress" title="Nodes you have opened">
        <svg class="progress-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="15"/>
          <circle class="fill" id="progressFill" cx="18" cy="18" r="15"/>
        </svg>
        <span><strong id="progressCount">0</strong>/<span id="progressTotal">0</span> explored</span>
      </div>
      <button class="btn" id="tourBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
        <span>Guided tour</span>
      </button>
      <button class="btn ghost" id="sourcesBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z M14 4v5h5"/></svg>
        <span>Sources &amp; team</span>
      </button>
      <button class="btn ghost icon-only" id="soundBtn" type="button" aria-pressed="false" aria-label="Toggle sound">
        <svg class="snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z M16 8.5a5 5 0 0 1 0 7 M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z M16 9l5 6 M21 9l-5 6"/></svg>
      </button>
      <button class="btn ghost icon-only" id="replayBtn" type="button" title="Replay intro" aria-label="Replay intro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      </button>
    </div>
  </header>

  <!-- the map -->
  <main class="viewport" id="viewport" aria-label="Interactive mind map. Drag to pan, scroll or pinch to zoom. Keys 1 to 5 jump to a question, 0 for overview.">
    <div class="stage" id="stage"></div>
  </main>

  <!-- question dock -->
  <nav class="dock" id="dock" aria-label="Questions"></nav>

  <!-- minimap + zoom -->
  <div class="minimap" id="minimap" title="Map overview — click a question to fly there"></div>
  <div class="zoom" role="group" aria-label="Zoom controls">
    <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
    <button type="button" id="zoomFit" aria-label="Fit to screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
  </div>

  <div class="hint" id="hint">
    <span class="hint-dot"></span>
    Click a question to fly in · tap a <strong>⊕</strong> to open a node · drag to pan · scroll to zoom
  </div>

  <!-- film letterbox + vignette (used during the intro and camera flights) -->
  <div class="letterbox lb-top" aria-hidden="true"></div>
  <div class="letterbox lb-bottom" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <button class="skip gone" id="skipIntro" type="button">Skip intro ›</button>

  <!-- title card -->
  <section class="intro" id="intro" hidden aria-label="Introduction">
    <div class="intro-glow" aria-hidden="true"></div>
    <div class="intro-inner">
      <p class="intro-kicker">INY 715 · Assignment 2 · Interactive mind map</p>
      <h2 class="intro-title">
        <span class="w" style="--w:0">Information</span>
        <span class="w" style="--w:1">Ethics</span>
        <span class="w it" style="--w:2">in the</span>
        <span class="w" style="--w:3">Metaverse</span>
      </h2>
      <ol class="intro-qs" id="introQuestions"></ol>
      <div class="intro-actions">
        <button class="btn" id="enterSound" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/></svg><span>Enter with sound</span>
        </button>
        <button class="btn ghost" id="enterQuiet" type="button"><span>Enter quietly</span></button>
      </div>
      <p class="intro-tip">Best experienced full-screen · sound is soft and optional</p>
    </div>
  </section>

  <!-- detail portal -->
  <div class="portal" id="portal" hidden>
    <div class="portal-bg" id="portalBg"></div>
    <article class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <header class="panel-head">
        <div>
          <p class="panel-kicker" id="panelKicker"></p>
          <h2 class="panel-title" id="panelTitle"></h2>
          <p class="panel-question" id="panelQuestion"></p>
        </div>
        <button class="panel-close" id="panelClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="panel-body" id="panelBody"></div>
      <footer class="panel-foot">
        <button class="btn ghost" id="prevBtn" type="button">‹ Previous</button>
        <span class="panel-step" id="panelStep"></span>
        <button class="btn" id="nextBtn" type="button">Next ›</button>
      </footer>
    </article>
  </div>

  <!-- drawer: sources & team / dev checklist -->
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="drawer-inner">
      <header class="drawer-head">
        <h2 id="drawerTitle">Sources &amp; team</h2>
        <button class="panel-close" id="drawerClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="drawerBody"></div>
    </div>
  </aside>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 1. namespace -->
  <script src="js/core/namespace.js"></script>
  <!-- 2. data -->
  <script src="js/data/config.js"></script>
  <script src="js/data/center.js"></script>
  <script src="js/data/team.js"></script>
  <!-- 3. one file per question -->
  <script src="js/branches/q1-metaverse.js"></script>
  <script src="js/branches/q2-digital-identity.js"></script>
  <script src="js/branches/q3-second-life.js"></script>
  <script src="js/branches/q4-metaverse-ie.js"></script>
  <script src="js/branches/q5-mmog-violence.js"></script>
  <script src="js/data/links.js"></script>
  <!-- 4. engine -->
  <script src="js/core/layout.js"></script>
  <script src="js/core/render.js"></script>
  <script src="js/core/camera.js"></script>
  <script src="js/core/media.js"></script>
  <script src="js/core/panel.js"></script>
  <script src="js/core/sound.js"></script>
  <script src="js/core/intro.js"></script>
  <script src="js/core/minimap.js"></script>
  <script src="js/core/devtools.js"></script>
  <!-- 5. start -->
  <script src="js/app.js"></script>
</body>
</html>
